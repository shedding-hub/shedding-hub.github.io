title: Shedding Hub
url: https://shedding-hub.github.io
strict_front_matter: true
exclude:
  - Gemfile
  - Gemfile.lock
  - Makefile
  - tmp/
  - vendor/
keep_files:
  - _datasets
collections:
  datasets:
    output: true
defaults:
  - scope:
      path: ""
      type: datasets
    values:
      layout: dataset
