title: Shedding Hub
description: >-
  Open data and statistical models for biomarker shedding: standardized,
  validated shedding datasets from peer-reviewed studies to support
  wastewater-based epidemiology.
url: https://sheddinghub.org
# sitemap.xml and the <head> SEO tags (meta description, canonical URL,
# JSON-LD) that Google reads. Both are Gemfile dependencies, not
# github-pages whitelisted plugins, since CI builds with bundler.
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
strict_front_matter: true
# Manual biocuration closed at 39 studies; everything curated since is AI-assisted,
# so the AI-curated count is the collection size minus this constant.
manual_curated_count: 39
exclude:
  - Gemfile
  - Gemfile.lock
  - Makefile
  - tmp/
  - tools/
  - vendor/
keep_files:
  - _datasets
collections:
  datasets:
    output: true
defaults:
  - scope:
      path: ""
      type: datasets
    values:
      layout: dataset
