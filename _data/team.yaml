andrew:
  group: leadership
  first: Yuke (Andrew)
  last: Wang
  job: Assistant Research Professor
  institution: Rollins School of Public Health, Emory University
  email: yuke[dot]wang[at]emory[dot]edu
  # Institutional profile, kept distinct from the personal site below. The
  # homepage leadership card links here, the way the advisor cards link to
  # theirs; the Team page still lists the personal site.
  profile: https://sph.emory.edu/profile/faculty/yuke-wang
  website: https://ywan446.github.io/
  github: YWAN446
  bio: Yuke (Andrew) Wang sets the overall direction of the Shedding Hub project and leads the teams to build the AI-powered multi-agent system for data curation.
  description: |
    My research interests span the areas of exposure assessment, wastewater surveillance, and infectious disease transmission. A common thread in my research is understanding the human-environment interface with respect to infectious diseases. I design, develop, and evaluate statistical and mathematical models to support evidence-informed public health decision-making in low- and middle-income countries (LMICs) and in the United States.

    More recently I have been developing **AI-powered evidence synthesis**: multi-agent systems that find the studies, extract the measurements, and check what was extracted against the source, with a human curator deciding what is accepted. Shedding Hub is the first application, and the approach is not specific to shedding — the same shape applies wherever the numbers worth having are locked in the text and figures of published papers.

    I am more broadly interested in what **AI agents can do for public health**: not only synthesising the evidence, but putting it to work. [EpiChat](https://ywan446.github.io/epichat/) is one example — it turns a plain-language question into a validated epidemiological simulation, so a surveillance team or policy officer can explore a scenario without waiting on a modeller.

    I am an Investigator of the [Emory Center for Infectious Disease Modeling & Analytics and Training Hub (CIDMATH)](https://cidmath.org/) and a Core Investigator at the [Center for Global Safe Water, Sanitation, and Hygiene (CGSW)](https://www.cgswash.org/).
till:
  group: leadership
  first: Till
  last: Hoffmann
  job: Research Associate
  institution: Harvard T.H. Chan School of Public Health
  website: https://tillahoffmann.github.io/
  github: tillahoffmann
  bio: Till Hoffmann sets the overall technology vision of the Shedding Hub project and oversees the technical implementation and software engineering.
  description: |
    I develop affordable, equitable public health monitoring solutions that impose a minimal burden on the population. My research connects models with complex, often messy real-world datasets, such as data not originally intended for research purposes. I am particularly interested in open and reproducible science based on data that adheres to the principle of privacy by design—without compromising the insights we can glean.

    Previously, I was a Postdoctoral Research Associate at [Imperial College London](https://www.imperial.ac.uk/mathematics), Staff Research Scientist at [Spotify](https://research.atspotify.com), and Principal Research Scientist at [Sonalytic](https://techcrunch.com/2017/03/07/spotify-acquires-audio-detection-startup-sonalytic/). I received my PhD from Imperial College London under the supervision of [Nick S. Jones](https://www.imperial.ac.uk/people/nick.jones) and Master of Physics from the [University of Oxford](https://www.physics.ox.ac.uk).
